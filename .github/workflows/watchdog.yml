# 사이트 갱신 정체 감시 (SPEC 9장, 기능 0-e). 외부 cron(cron-job.org)이 1시간마다 workflow_dispatch로 호출한다 — update.yml과 같은 토큰.
# 배포된 사이트의 news.json updatedAt이 90분을 넘게 지났고 update.yml 실행이 30분을 넘게 queued/waiting/in_progress면 그 실행을 취소하고
# 디스코드에 경고한다 (같은 정체로는 처음 한 번, 이후 6시간마다 한 번). 정상이면 아무것도 하지 않는다.
# - update.yml과 다른 concurrency 그룹이다: update 실행이 `pages` 그룹에서 막혀 있어도 이 점검은 돈다.
#   점검 자신이 막히지 않도록 새 점검이 오면 이전 점검을 대체한다(cancel-in-progress: true).
# - 권한은 actions: write(실행 조회·취소)와 contents: read(checkout)뿐이다. Pages·id-token 권한이 없다.
# - Secret은 필요한 단계의 env에만 넣는다: GITHUB_TOKEN(자동 토큰) → watchdog.py, DISCORD_WEBHOOK_URL → send_alerts.py.
name: watchdog

on:
  workflow_dispatch:

concurrency:
  group: watchdog
  cancel-in-progress: true

permissions:
  actions: write
  contents: read

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - id: check
        name: 점검 (정체면 오래된 update 실행 취소 + 경고 파일 out/alerts.json)
        run: python watchdog.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 이 단계 이름은 updater/config.py의 WATCHDOG_ALERT_STEP과 같아야 한다: 이전 점검 실행에서 이 단계가 success였는지가 '경고를 이미 보냈는가'의 기록이다
      - name: 경고 발송
        if: steps.check.outputs.alert == 'true'
        run: python send_alerts.py
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
